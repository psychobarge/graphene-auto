<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistes d'icône</title>
<style>
  :root { --bg: #f4f4f5; --fg: #18181b; --muted: #71717a; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f4f4f5; --muted: #a1a1aa; --card: #1c1c1f; } }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  h1 { font-size: 19px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .col { background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  h2 { font-size: 15px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .sw { display: flex; gap: 6px; justify-content: center; }
  .sw span { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #8884; }
  .masks { display: flex; gap: 10px; justify-content: center; }
  /* The launcher shows the middle 72 of the 108 viewport. */
  .mask { overflow: hidden; position: relative; flex: none; }
  .mask img { position: absolute; width: 150%; height: 150%; left: -25%; top: -25%; }
  .circle { border-radius: 50%; } .squircle { border-radius: 30%; }
  .home { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; }
  .home.dark { background: linear-gradient(135deg, #2b2d42, #0b0c10); }
  .home.light { background: linear-gradient(135deg, #e9e4d8, #c9d6df); }
  .label { font-size: 11px; color: var(--muted); }
  img.full { width: 100%; max-width: 150px; border-radius: 8px; }
</style>
</head>
